replicaCount: 1
image:
  repository: ghcr.io/asilvasaraiva/cct-catalog
  pullPolicy: Always
  tag: "1.2.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

ingress:
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

probes:
  liveness:
    path: /health/live/
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /health/ready/
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

loadSecretsFrom: books-database-postgresql
environmentVariables:
  - name: DATABASE_USER
    value: books
  - name: DATABASE_NAME
    value: books
  - name: DATABASE_HOST
    value: books-database-postgresql-0.books-database-postgresql-hl.default.svc.cluster.local
  - name: DEVELOPMENT_MODE
    value: "false"
  - name: DJANGO_ALLOWED_HOSTS
    value: "*"
